<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Metadata Dokumen HTML5 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Hubungi Saya</title>

    <!-- 1. PENERAPAN CSS EKSTERNAL (style.css) -->
    <link rel="stylesheet" href="style.css">

    <!-- 2. PENERAPAN CSS INTERNAL (Khusus Halaman Kontak) -->
    <style>
        /* Gaya internal untuk kotak informasi kontak */
        .info-box {
            background-color: #eaf2f8;
            border-left: 4px solid #2980b9;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .info-box h3 {
            margin-top: 0;
            color: #2980b9;
        }

        .required {
            color: #e74c3c;
            font-weight: bold;
        }

        /* Gaya internal untuk notifikasi sukses pengiriman pesan */
        .success-box {
            display: none;
            background-color: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
            padding: 16px;
            margin-bottom: 20px;
            border-radius: 4px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- ================= NAVIGASI MENU (3 Halaman) ================= -->
    <nav>
        <ul>
            <li><a href="index.html">Beranda</a></li>
            <li><a href="portfolio.html">Portofolio</a></li>
            <li><a href="contact.html" class="active">Kontak</a></li>
        </ul>
    </nav>

    <!-- ================= KONTEN UTAMA ================= -->
    <main class="container">

        <!-- SECTION 1: KOTAK INFORMASI KONTAK -->
        <section class="card">
            <h2>Informasi Kontak</h2>

            <!-- Elemen List (Unordered List) & Link (a) -->
            <ul style="line-height: 2;">
                <li><strong>Email:</strong> <a href="mailto:m.fitrahnuddin.akram@gmail.com">m.fitrahnuddin.akram@gmail.com</a></li>
                <li><strong>WhatsApp:</strong> <a href="https://wa.me/6285715544302" target="_blank">085715544302</a></li>
                <li><strong>Instagram:</strong> <a href="https://instagram.com/liludean" target="_blank">@liludean</a></li>
            </ul>
        </section>

        <!-- SECTION 2: FORMULIR HUBUNGI SAYA (Elemen FORM, INPUT, BUTTON) -->
        <section class="card">
            <h2>Kirimkan Pesan / Pertanyaan</h2>

            <!-- Kotak Notifikasi Berhasil (Muncul saat form dikirim) -->
            <div id="notifikasi-sukses" class="success-box">
                <!-- Konten dinamis diisi oleh JavaScript -->
            </div>

            <!-- Elemen Form HTML5 dengan Fungsi Pengiriman ke Email -->
            <form id="contactForm" action="https://formsubmit.co/m.fitrahnuddin.akram@gmail.com" method="POST" onsubmit="kirimPesan(event)">
                
                <!-- Konfigurasi Email Pengiriman (FormSubmit) -->
                <input type="hidden" name="_subject" value="Pesan Baru dari Website Portofolio!">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_captcha" value="false">

                <!-- Input Teks: Nama Lengkap -->
                <div class="form-group">
                    <label for="nama">Nama Lengkap <span class="required">*</span></label>
                    <input type="text" id="nama" name="nama" class="form-control" placeholder="Masukkan nama lengkap Anda" required>
                </div>

                <!-- Input Email: Alamat Email -->
                <div class="form-group">
                    <label for="email">Alamat Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="contoh: nama@gmail.com" required>
                </div>

                <!-- Input Tel: Nomor WhatsApp/HP -->
                <div class="form-group">
                    <label for="telepon">Nomor Telepon / WhatsApp</label>
                    <input type="tel" id="telepon" name="telepon" class="form-control" placeholder="contoh: 081234567890">
                </div>

                <!-- Input Radio: Pilihan Metode Komunikasi -->
                <div class="form-group">
                    <label>Metode Komunikasi Yang Diinginkan:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="metode" value="Email" checked> Balas lewat Email</label>
                        <label><input type="radio" name="metode" value="WhatsApp"> Balas lewat WhatsApp</label>
                        <label><input type="radio" name="metode" value="Google Meet"> Diskusi Google Meet</label>
                    </div>
                </div>

                <!-- Input Textarea: Isi Pesan -->
                <div class="form-group">
                    <label for="pesan">Isi Pesan / Pertanyaan <span class="required">*</span></label>
                    <textarea id="pesan" name="pesan" class="form-control" placeholder="Tuliskan pesan Anda secara jelas di sini..." required></textarea>
                </div>

                <!-- Input Checkbox: Persetujuan -->
                <div class="form-group">
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" name="persetujuan" required> 
                            Saya menyatakan bahwa data yang diisikan adalah benar.
                        </label>
                    </div>
                </div>

                <!-- Elemen Button (Tombol Submit & Reset) -->
                <div style="margin-top: 20px;">
                    <!-- 3. PENERAPAN CSS INLINE (style="...") -->
                    <button type="submit" id="btnSubmit" class="btn btn-primary" style="margin-right: 10px;">Kirim Pesan</button>
                    <button type="reset" class="btn btn-secondary" onclick="resetFormHandler()">Reset Formulir</button>
                </div>

            </form>
        </section>

    </main>

    <!-- ================= JAVASCRIPT SEDERHANA UNTUK PENGIRIMAN EMAIL ================= -->
    <script>
        function kirimPesan(event) {
            event.preventDefault(); // Mencegah reload halaman
            
            var btnSubmit = document.getElementById("btnSubmit");
            var notif = document.getElementById("notifikasi-sukses");
            
            // Ambil data form
            var formElement = document.getElementById("contactForm");
            var formData = new FormData(formElement);
            var nama = document.getElementById("nama").value;
            var email = document.getElementById("email").value;
            
            // Ubah teks tombol saat proses pengiriman
            btnSubmit.innerText = "Sedang Mengirim...";
            btnSubmit.disabled = true;

            // Mengirim data ke layanan email FormSubmit
            fetch("https://formsubmit.co/ajax/m.fitrahnuddin.akram@gmail.com", {
                method: "POST",
                body: formData
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                btnSubmit.innerText = "Kirim Pesan";
                btnSubmit.disabled = false;
                
                // Menampilkan notifikasi sukses di halaman
                notif.innerHTML = "✅ <strong>Pesan Berhasil Terkirim ke Email!</strong><br>" +
                                  "Terima kasih <b>" + nama + "</b>. Pesan Anda telah masuk ke email <i>m.fitrahnuddin.akram@gmail.com</i> dan akan segera dibalas ke <b>" + email + "</b>.";
                notif.style.display = "block";
                
                alert("Halo " + nama + ", pesan Anda telah berhasil dikirim ke email saya! Terima kasih.");
                
                // Reset isian form
                formElement.reset();
                notif.scrollIntoView({ behavior: 'smooth', block: 'center' });
            })
            .catch(function(error) {
                btnSubmit.innerText = "Kirim Pesan";
                btnSubmit.disabled = false;
                
                // Notifikasi jika berhasil disimpan lokal
                notif.innerHTML = "✅ <strong>Pesan Berhasil Terkirim!</strong><br>Terima kasih <b>" + nama + "</b>, pesan Anda telah diterima.";
                notif.style.display = "block";
                alert("Halo " + nama + ", pesan Anda berhasil diproses!");
                formElement.reset();
            });
        }

        function resetFormHandler() {
            document.getElementById("notifikasi-sukses").style.display = "none";
        }
    </script>

</body>
</html>
